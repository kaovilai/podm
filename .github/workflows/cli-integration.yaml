# Flagship proof workflow: builds pacmand from source, stands it up over
# Apple's container runtime, and drives it with the REAL docker and podman
# CLIs — no podman machine, no remote connection setup, exactly the user
# experience pacman exists to provide.
#
# Steps that need the Virtualization framework (docker/podman run, docker
# build, multi-arch builds) are gated behind the `enable-vm-steps` /
# `enable-multiarch` dispatch inputs (default false). GitHub-hosted macOS
# runners run inside VMs without nested virtualization, so pacmand's
# microVM-based container execution and BuildKit builder VM cannot boot
# there ("Error Domain=VZErrorDomain Code=2 Virtualization is not
# available on this hardware" — see the notes in pr-check.yaml and
# https://github.com/actions/runner-images/issues/12933). On pull_request
# events the inputs are unset, so those steps stay skipped. Enable them on
# a self-hosted Apple silicon runner (see scripts/bootstrap-box.sh and
# docs/ci.md) to run the full matrix.

name: cli-integration

on:
  workflow_dispatch:
    inputs:
      enable-vm-steps:
        description: 'Run steps that need the Virtualization framework (docker/podman run, docker build)'
        type: boolean
        default: false
      enable-multiarch:
        description: 'Run the multi-arch build job (needs a Virtualization-framework-capable runner)'
        type: boolean
        default: false
      vm-runner:
        description: 'Runner label for VM-gated jobs/steps (a self-hosted runner with nested virtualization; hosted macos-26 has none)'
        type: string
        default: macos-26
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-integration:
    name: docker + podman CLI smoke tests
    # GitHub-hosted macOS runners expose no nested virtualization
    # (actions/runner-images#12933): the VM-gated steps below only work when
    # this workflow is dispatched with vm-runner pointing at a
    # Virtualization-framework-capable (self-hosted) runner.
    runs-on: ${{ inputs.vm-runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Display swift version
        run: |
          which swift
          swift --version

      - name: Build pacmand (release)
        timeout-minutes: 40
        # Build only the daemon product. The `pacman` client shim target
        # (Sources/pacman/) may not exist yet; it is built by the guarded
        # step below once it lands.
        run: swift build -c release --product pacmand

      - name: Build pacman client shim (if present)
        # The client shim target is under active development and may not
        # exist on every branch; never fail the workflow because of it.
        run: |
          if [ -d Sources/pacman ] && grep -q '"pacman"' Package.swift; then
            swift build -c release --product pacman
            .build/arm64-apple-macosx/release/pacman --help || true
          else
            echo "Sources/pacman not present yet; skipping client shim build"
          fi

      # ── Apple container runtime setup (mirrors pr-check.yaml) ────────────────
      - name: fetch apple container
        run: |
          # Runtime version, deliberately NOT the Package.resolved pin: Apple
          # rotates the kernel archive on their CDN and older runtime pins carry
          # stale expected digests -- `container system start
          # --enable-kernel-install` then fails with "kernel archive digest
          # mismatch" on fresh runners (seen 2026-11-09 with the 1.2.0 pin).
          # The daemon only warns on linked-vs-runtime version mismatch, so a
          # current runtime is both safer and compatible.
          APPLE_CONTAINER_VERSION=${APPLE_CONTAINER_VERSION:-1.6.1}
          wget "https://github.com/apple/container/releases/download/${APPLE_CONTAINER_VERSION}/container-installer-unsigned.pkg" \
            -O container-installer-signed.pkg

      - name: install apple container
        run: sudo installer -pkg container-installer-signed.pkg -target / -verbose

      # See the long comment on the same step in pr-check.yaml: `container
      # system start` writes the apiserver launchd plist, then bootstraps it
      # via a launchctl call whose output and exit status it discards. Under
      # sudo in a CI session the computed domain can't be bootstrapped into,
      # so on failure we bootstrap the plist into the system domain ourselves
      # and re-run start.
      - name: Start container system
        run: |
          if ! sudo container system start --enable-kernel-install; then
            PLIST="$(sudo find /var/root "$HOME" -maxdepth 6 \
              -path '*/com.apple.container/apiserver/apiserver.plist' 2>/dev/null | head -1)"
            [ -n "$PLIST" ] || { echo "apiserver.plist not found" >&2; exit 1; }
            sudo launchctl bootstrap system "$PLIST"
            sudo container system start --enable-kernel-install
          fi
          sudo container system status

      # `system start` kicks off the kernel download asynchronously; this
      # blocks until the kernel is actually installed (needed for builds).
      - name: Install default Linux kernel for container builds
        run: sudo container system kernel set --recommended --force

      # ── Start pacmand ─────────────────────────────────────────────────────────
      # The daemon derives its socket from $HOME (.pacman/container.sock);
      # started via `sudo -i` that is /var/root/.pacman/container.sock, same
      # as the fork's CI. The docker socket symlink lets the stock docker CLI
      # work with no DOCKER_HOST setup at all.
      - name: Start pacmand and wait for its socket
        run: |
          PACMAND_BIN="$(pwd)/.build/arm64-apple-macosx/release/pacmand"
          chmod 755 "$PACMAND_BIN"
          nohup sudo -i env PACMAN_IDLE_EXIT_SECS=0 "$PACMAND_BIN" > service.log 2>&1 &
          echo $! > service.pid
          sudo ln -sf /var/root/.pacman/container.sock /var/run/docker.sock
          START=$SECONDS
          TIMEOUT=60
          while [ $((SECONDS - START)) -lt $TIMEOUT ]; do
            if sudo test -S /var/root/.pacman/container.sock; then
              echo "pacmand socket is up after ${SECONDS}s"
              break
            fi
            sleep 2
          done
          sudo test -S /var/root/.pacman/container.sock || { echo "socket never appeared"; cat service.log || true; sudo cat /var/root/service.log 2>/dev/null || true; exit 1; }
          sleep 2
          cat service.log || true
          sudo docker version || true

      # ── docker CLI ────────────────────────────────────────────────────────────
      - name: install docker cli
        run: |
          brew install docker

      - name: docker ps / version / images against pacmand
        run: |
          sudo docker ps
          sudo docker version | grep 'pacman'
          sudo docker version | grep 'v1.51'
          sudo docker images

      - name: docker pull and list images
        run: |
          # quay.io/podman/hello has no auth or rate-limit issues (see pr-check.yaml)
          sudo docker pull quay.io/podman/hello
          sudo docker pull alpine:latest
          sudo docker image ls --format '{{.Repository}}:{{.Tag}}' | grep alpine
          IMAGE_ID=$(sudo docker image inspect alpine | jq -r '.[0].Id')
          [[ $IMAGE_ID == sha256:* ]] || { echo "Error: Image ID does not start with sha256:"; exit 1; }

      - name: docker run --rm alpine echo hello
        if: inputs.enable-vm-steps == true
        run: |
          # Needs the Virtualization framework (microVM per container);
          # cannot boot on GitHub-hosted macOS runners — enable on a
          # self-hosted runner (scripts/bootstrap-box.sh).
          OUT=$(sudo docker run --rm alpine:latest echo hello)
          echo "$OUT"
          [[ "$OUT" == *"hello"* ]] || { echo "docker run did not print hello"; exit 1; }
          sudo docker ps -a | wc -l

      - name: docker build a tiny Dockerfile
        if: inputs.enable-vm-steps == true
        run: |
          # DOCKER_BUILDKIT=0 keeps the CLI on the classic builder: pacman
          # implements the classic tar-over-POST /build API; the buildx
          # docker-container driver would try to start a moby/buildkit
          # container inside pacman, which is not supported (see
          # pr-check.yaml's multi-arch job). The server-side builder still
          # needs the Virtualization framework.
          mkdir -p /tmp/testbuild
          cat > /tmp/testbuild/Dockerfile <<'EOF'
          FROM alpine:latest
          RUN echo "built by docker CLI" > /built.txt
          CMD ["cat", "/built.txt"]
          EOF
          sudo env DOCKER_BUILDKIT=0 docker build -t cli-int-build /tmp/testbuild
          sudo docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'cli-int-build'
          OUT=$(sudo docker run --rm cli-int-build)
          echo "$OUT"
          [[ "$OUT" == *"built by docker CLI"* ]] || { echo "docker run of built image failed"; exit 1; }

      # ── podman CLI ───────────────────────────────────────────────────────────
      - name: install podman cli
        run: |
          brew install podman

      - name: setup podman socket
        run: |
          # /run is read-only on macOS, so use CONTAINER_HOST env var
          echo "CONTAINER_HOST=unix:///var/root/.pacman/container.sock" >> "$GITHUB_ENV"

      - name: podman ps / version against pacmand
        run: |
          sudo -E podman ps
          sudo -E podman version
          # Verify pacman is responding with expected API version
          sudo -E podman version | grep 'v1.51'

      - name: podman pull and list images
        run: |
          sudo -E podman pull alpine:latest
          sudo -E podman image ls | grep alpine

      - name: podman run --rm alpine echo hello
        if: inputs.enable-vm-steps == true
        run: |
          # Needs the Virtualization framework; see the docker run step above.
          OUT=$(sudo -E podman run --rm alpine:latest echo hello)
          echo "$OUT"
          [[ "$OUT" == *"hello"* ]] || { echo "podman run did not print hello"; exit 1; }

      - name: podman build a tiny Dockerfile
        if: inputs.enable-vm-steps == true
        run: |
          # Real podman CLI sends the build to pacmand's build API. Needs the
          # BuildKit builder VM (Virtualization framework) on the runner.
          mkdir -p /tmp/testbuild-podman
          cat > /tmp/testbuild-podman/Dockerfile <<'EOF'
          FROM alpine:latest
          RUN echo "built by podman CLI" > /built.txt
          CMD ["cat", "/built.txt"]
          EOF
          sudo -E podman build -t cli-int-podman-build /tmp/testbuild-podman
          sudo -E podman image ls | grep 'cli-int-podman-build'

      # Manifest workflow mirrored from pr-check.yaml's integration-test job:
      # create/add/inspect/exists need no running container or BuildKit VM.
      - name: podman manifest workflow
        run: |
          sudo -E podman manifest create cli-int-manifest
          sudo -E podman manifest add cli-int-manifest alpine:latest
          sudo -E podman manifest inspect cli-int-manifest | grep 'image.index.v1+json'
          sudo -E podman manifest exists cli-int-manifest

      # Push to ttl.sh (public ephemeral registry, no auth) — mirrored from
      # pr-check.yaml; real regression coverage for the push/manifest-push paths.
      - name: podman push to ttl.sh
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -lt 3 ]; then
                echo "attempt ${attempt} failed, retrying..." >&2
                sleep 5
              fi
            done
            return 1
          }
          TAG="cli-int-$(date +%s)"
          retry sudo -E podman push alpine:latest "ttl.sh/pacman-cli-int-${TAG}:5m"
          sudo -E podman manifest create cli-int-push-manifest
          retry sudo -E podman manifest push cli-int-push-manifest "ttl.sh/pacman-cli-int-manifest-${TAG}:5m"

      - name: dump service log
        if: always()
        run: |
          cat service.log || true
          sudo pkill -f pacmand || true

      # Binary artifact for the multi-arch job below (same artifact name and
      # layout as pr-check.yaml's build job: artifact `pacman`, file `pacmand`).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pacman
          path: ./.build/arm64-apple-macosx/release/pacmand

  # ── Multi-arch build test (mirrors pr-check.yaml's multi-arch-build job) ─────
  # Rosetta builder for amd64, QEMU builder for s390x, assembled manifest list.
  # Gated behind the `enable-multiarch` dispatch input: like the VM steps
  # above, the builder containers need the Virtualization framework, which
  # GitHub-hosted macOS runners don't expose (nested virtualization).
  multi-arch-build:
    name: multi-arch build test (amd64 + arm64 + s390x)
    needs: cli-integration
    if: inputs.enable-multiarch == true
    runs-on: ${{ inputs.vm-runner || 'macos-26' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fetch the artifact from the cli-integration job
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacman

      - name: Prepare pacman binary
        run: |
          ls -la
          chmod 755 pacmand

      - name: Fetch Apple Container installer
        run: |
          # Runtime version, deliberately NOT the Package.resolved pin: Apple
          # rotates the kernel archive on their CDN and older runtime pins carry
          # stale expected digests -- `container system start
          # --enable-kernel-install` then fails with "kernel archive digest
          # mismatch" on fresh runners (seen 2026-11-09 with the 1.2.0 pin).
          # The daemon only warns on linked-vs-runtime version mismatch, so a
          # current runtime is both safer and compatible.
          APPLE_CONTAINER_VERSION=${APPLE_CONTAINER_VERSION:-1.6.1}
          wget "https://github.com/apple/container/releases/download/${APPLE_CONTAINER_VERSION}/container-installer-unsigned.pkg" \
            -O container-installer-signed.pkg

      - name: Install Apple Container
        run: sudo installer -pkg container-installer-signed.pkg -target / -verbose

      # Same launchctl workaround as the cli-integration job above (and
      # pr-check.yaml); the fork's multi-arch job drove this through tmate,
      # which is deprecated in Homebrew (disabled 2026-12-11).
      - name: Start Apple Container system
        run: |
          if ! sudo container system start --enable-kernel-install; then
            PLIST="$(sudo find /var/root "$HOME" -maxdepth 6 \
              -path '*/com.apple.container/apiserver/apiserver.plist' 2>/dev/null | head -1)"
            [ -n "$PLIST" ] || { echo "apiserver.plist not found" >&2; exit 1; }
            sudo launchctl bootstrap system "$PLIST"
            sudo container system start --enable-kernel-install
          fi
          sudo container system status

      - name: Install default Linux kernel for container builds
        run: sudo container system kernel set --recommended --force

      - name: Start pacman
        run: |
          PACMAND_BIN="$(pwd)/pacmand"
          nohup sudo -i env PACMAN_IDLE_EXIT_SECS=0 "$PACMAND_BIN" > service.log 2>&1 &
          echo $! > service.pid
          sudo ln -s /var/root/.pacman/container.sock /var/run/docker.sock
          sleep 5
          cat service.log

      - name: Install docker, docker-buildx, and podman CLIs
        run: |
          brew install docker docker-buildx podman
          # docker-buildx is installed as a CLI plugin by Homebrew under
          # /opt/homebrew/lib/docker/cli-plugins/docker-buildx.
          # Make it visible to sudo (which may search a different prefix).
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo ln -sf "$(brew --prefix)/lib/docker/cli-plugins/docker-buildx" \
            /usr/local/lib/docker/cli-plugins/docker-buildx

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/testbuild
          cat > /tmp/testbuild/Dockerfile <<'EOF'
          FROM alpine:3
          RUN echo "Built for $(uname -m)" > /arch.txt
          CMD ["sh", "-c", "cat /arch.txt"]
          EOF

      # ── Rosetta path: arm64 + amd64 ──────────────────────────────────────────
      # docker buildx build with the default docker-container driver would start
      # a moby/buildkit container inside pacman, which is not supported.
      # We call the Docker build API directly via curl instead; pacman routes
      # multi-platform requests to its Rosetta / QEMU builder containers.
      - name: docker build – arm64+amd64 (Rosetta builder)
        run: |
          tar -c -C /tmp/testbuild . | \
            sudo curl -sS --fail-with-body --unix-socket /var/run/docker.sock \
              -X POST \
              -H "Content-Type: application/x-tar" \
              --data-binary @- \
              "http://localhost/build?t=test-multiarch%3Arosetta&platform=linux%2Farm64%2Clinux%2Famd64"
          sudo docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'test-multiarch:rosetta'

      # ── QEMU path: s390x ─────────────────────────────────────────────────────
      - name: docker build – s390x (QEMU builder)
        run: |
          tar -c -C /tmp/testbuild . | \
            sudo curl -sS --fail-with-body --unix-socket /var/run/docker.sock \
              -X POST \
              -H "Content-Type: application/x-tar" \
              --data-binary @- \
              "http://localhost/build?t=test-multiarch%3As390x&platform=linux%2Fs390x"
          sudo docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'test-multiarch:s390x'

      # ── Combined manifest list: arm64 + amd64 + s390x ────────────────────────
      - name: docker build – combined amd64+arm64+s390x manifest list
        run: |
          tar -c -C /tmp/testbuild . | \
            sudo curl -sS --fail-with-body --unix-socket /var/run/docker.sock \
              -X POST \
              -H "Content-Type: application/x-tar" \
              --data-binary @- \
              "http://localhost/build?t=test-multiarch%3Alatest&platform=linux%2Farm64%2Clinux%2Famd64%2Clinux%2Fs390x"
          sudo docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'test-multiarch:latest'

      - name: Verify manifest list contains amd64, arm64, and s390x
        run: |
          MANIFESTS=$(sudo curl -sS --fail-with-body --unix-socket /var/run/docker.sock \
            "http://localhost/images/test-multiarch:latest/json?manifests=true" \
            | jq -r '[.Manifests[]? | select(.Kind == "image") | .ImageData.Platform.architecture // empty] | unique | sort | join(",")')
          echo "Platforms in manifest list: $MANIFESTS"
          [[ "$MANIFESTS" == *"amd64"* ]] || { echo "ERROR: amd64 missing from manifest list"; exit 1; }
          [[ "$MANIFESTS" == *"arm64"* ]] || { echo "ERROR: arm64 missing from manifest list"; exit 1; }
          [[ "$MANIFESTS" == *"s390x"* ]] || { echo "ERROR: s390x missing from manifest list"; exit 1; }
          echo "✓ Manifest list verified: amd64, arm64, and s390x all present"

      - name: dump service log
        if: always()
        run: |
          cat service.log || true
          sudo pkill -f pacmand || true
