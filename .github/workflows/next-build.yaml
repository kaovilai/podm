name: next build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

permissions:
  contents: read

jobs:

  # The `secrets` context is not available in jobs.<id>.if — GitHub rejects the
  # workflow file with "Unrecognized named-value: 'secrets'". Convert the
  # secret presence checks into job outputs here and gate the real jobs on
  # those outputs (needs.*.outputs IS available in job-level if).
  check-secrets:
    name: Secret availability
    runs-on: ubuntu-24.04
    outputs:
      has_bot_token: ${{ steps.check.outputs.has_bot_token }}
      has_certs: ${{ steps.check.outputs.has_certs }}
    steps:
      - id: check
        run: |
          echo "has_bot_token=${{ secrets.PACMAN_BOT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_certs=${{ secrets.CERTIFICATE_P12_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

  tag:
    name: Tagging
    runs-on: ubuntu-24.04
    # disable on forks as secrets are not available; also skip until the
    # release bot token is configured on kaovilai/pacman (the fork's
    # socktainer-org bot token does not exist here)
    needs: check-secrets
    if: github.event.repository.fork == false && needs.check-secrets.outputs.has_bot_token == 'true'
    permissions:
      contents: write
    outputs:
      githubTag: ${{ steps.TAG_UTIL.outputs.githubTag}}
      pacmanVersion: ${{ steps.TAG_UTIL.outputs.pacmanVersion}}
      releaseId: ${{ steps.create_release.outputs.id}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
         token: ${{ secrets.PACMAN_BOT_TOKEN }}
         fetch-depth: 0
      - name: Generate tag utilities
        id: TAG_UTIL
        run: |
            CURRENT_DAY=$(date +'%Y%m%d')
            SHORT_SHA1=$(git rev-parse --short HEAD)
            # grab the latest tags
            git fetch --tags
            # nearest stable tag on main
            # - fresh clones of pacman have no tags yet (unlike the socktainer
            #   fork this repo was imported from) — fall back so the bump math works
            # - exclude the generated v<version>-next.<timestamp>-<sha> prerelease
            #   tags this workflow pushes to the same repository: git describe
            #   would otherwise select the previous prerelease tag, and its
            #   parsing then makes "minor" non-numeric and the bump arithmetic
            #   fails, stopping all subsequent prerelease builds
            PACMAND_VERSION=$(git describe --tags --abbrev=0 --exclude='*-next.*' main 2>/dev/null || echo v0.0.0)
            STRIPPED_VERSION=${PACMAND_VERSION#v}
            echo "Current version is $STRIPPED_VERSION"
            tmp=${STRIPPED_VERSION%.*}
            minor=${tmp#*.}
            bumpedVersion=${STRIPPED_VERSION%%.*}.$((minor + 1)).0
            TAG_PATTERN=${STRIPPED_VERSION}-next.$(date +'%Y%m%d%H%M')-${SHORT_SHA1}
            echo "githubTag=v$TAG_PATTERN" >> ${GITHUB_OUTPUT}
            echo "pacmanVersion=$TAG_PATTERN" >> ${GITHUB_OUTPUT}
      - name: tag
        run: |
          git config --local user.name ${{ github.actor }}
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          echo "Tagging with ${{ steps.TAG_UTIL.outputs.githubTag }}"
          git tag ${{ steps.TAG_UTIL.outputs.githubTag }}
          # push the tag to this repository (the fork pushed to a separate
          # socktainer-org "prereleases" repository, which does not exist here)
          git push origin ${{ steps.TAG_UTIL.outputs.githubTag }}

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.TAG_UTIL.outputs.githubTag }}
          name: ${{ steps.TAG_UTIL.outputs.githubTag }}
          draft: true
          prerelease: true
          token: ${{ secrets.PACMAN_BOT_TOKEN }}

  build:
    name: Build
    needs: [tag, check-secrets]
    # signing/notarization needs the Apple certificates; skip (rather than
    # fail) until they are configured on this repository
    if: needs.tag.result == 'success' && needs.check-secrets.outputs.has_certs == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.githubTag}}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable


      - name: Run Build
        timeout-minutes: 40
        run: make release

      - name: List Build
        run: ls -la ./.build/arm64-apple-macosx/release/

      - name: Decode .p12 certificate and setup keychain
        run: |
          # Decode certificate
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > signing_cert.p12
          echo "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 --decode > developer_id_cert.p12
          
          # Setup keychain
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security import signing_cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import developer_id_cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Sign binary
        run: |
          codesign --force \
            --sign "${{ secrets.APPLE_APPLICATION_ID}}" \
            --options runtime \
            --entitlements entitlements.plist \
            ./.build/arm64-apple-macosx/release/pacmand
    
      - name: zip the binary
        run: |
          cd ./.build/arm64-apple-macosx/release/
          zip pacmand.zip pacmand pacman

      - name: Submit for notarization
        run: |
          xcrun notarytool submit ./.build/arm64-apple-macosx/release/pacmand.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}

      - name: Create & sign the installer
        run: |
          make installer-notarized
        env:
          BUILD_VERSION: ${{ needs.tag.outputs.pacmanVersion}}
          APPLE_APPLICATION_ID: ${{ secrets.APPLE_APPLICATION_ID}}
          APPLE_PRODUCT_ID: ${{ secrets.APPLE_PRODUCT_ID}}  
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload pacman binary
        run: |
         gh release upload --repo "$GITHUB_REPOSITORY" ${{ needs.tag.outputs.githubTag}} ./.build/arm64-apple-macosx/release/pacmand
         gh release upload --repo "$GITHUB_REPOSITORY" ${{ needs.tag.outputs.githubTag}} ./.build/arm64-apple-macosx/release/pacmand.zip
         gh release upload --repo "$GITHUB_REPOSITORY" ${{ needs.tag.outputs.githubTag}} ./pkginstaller/out/pacman-installer.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.PACMAN_BOT_TOKEN }}

  release:
    needs: [tag, build]
    name: Release
    runs-on: ubuntu-24.04
    if: needs.build.result == 'success'
    steps:
      - name: id
        run: echo the release id is ${{ needs.tag.outputs.releaseId}}

      - name: Publish release
        uses: StuYarrow/publish-release@01f2a1365bacd77bad861873a7fdf274ab49eefd # v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.PACMAN_BOT_TOKEN }}
        with:
          id: ${{ needs.tag.outputs.releaseId}}

  brew-tap-update:
    needs: [tag, release, check-secrets]
    name: Homebrew Tap
    runs-on: ubuntu-24.04
    # requires the kaovilai/homebrew-tap repository (with an
    # update-formula-next.yml workflow) and PACMAN_BOT_TOKEN; skipped until then
    if: needs.release.result == 'success' && needs.check-secrets.outputs.has_bot_token == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kaovilai/homebrew-tap
          token: ${{ secrets.PACMAN_BOT_TOKEN }}
          fetch-depth: 0

      - name: Trigger and wait for Homebrew formula update
        run: |
          VERSION=${{ needs.tag.outputs.pacmanVersion}}
          echo "Triggering homebrew-tap workflow with version: $VERSION"

          # Trigger workflow run in homebrew-tap
          gh workflow run update-formula-next.yml \
            --repo kaovilai/homebrew-tap \
            --ref main \
            -f version="$VERSION"

          # Get the latest run ID for that workflow
          run_id=$(gh run list \
            --workflow update-formula-next.yml \
            --repo kaovilai/homebrew-tap \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "Waiting for workflow run ID: $run_id"

          # Watch until completion (streams logs & exits with same status)
          gh run watch "$run_id" --repo kaovilai/homebrew-tap
        env:
          GITHUB_TOKEN: ${{ secrets.PACMAN_BOT_TOKEN }}