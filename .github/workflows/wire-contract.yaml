name: wire-contract

# Records what the REAL podman CLI sends to a podm-shaped socket and
# diffs the request signatures against the checked-in baseline
# (scripts/wire-contract/baseline.json). Upstream call-signature drift —
# the class that shipped as #49 (absolute-path -f) and #52 (repeated t
# key) — fails the job with a per-command diff the day a new CLI behaves
# differently, instead of waiting for a user to hit it.
#
# Runs manually (dev/curiosity: pin any podman version, or refresh the
# baseline after an intentional podm-side change) and monthly as a
# canary against the latest podman.

on:
  workflow_dispatch:
    inputs:
      podman-version:
        description: 'podman client to test: "latest", "runner", or a x.y.z pin'
        default: 'latest'
      mode:
        description: 'check = diff vs baseline (fail on drift); refresh = upload a new baseline to commit'
        type: choice
        options: [check, refresh]
        default: 'check'
  schedule:
    - cron: '0 6 1 * *' # monthly canary: 1st of the month, 06:00 UTC

concurrency:
  group: wire-contract
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Acquire the podman client under test
        run: |
          set -eu
          MODE="${{ inputs.podman-version || 'latest' }}"
          if [ "$MODE" = "runner" ]; then
            # The runner's own podman, purely as a remote client (the
            # mock is the "server"; nothing needs a container runtime).
            echo "PODMAN_BIN=$(command -v podman)" >> "$GITHUB_ENV"
          else
            # containers/podman GitHub releases ship a static remote-only
            # client per version — exactly what the harness needs.
            if [ "$MODE" = "latest" ]; then
              TAG=$(gh api repos/containers/podman/releases/latest --jq .tag_name)
            else
              TAG="v$MODE"
            fi
            mkdir -p "$RUNNER_TEMP/podman-remote" && cd "$RUNNER_TEMP/podman-remote"
            curl -sSfL -o remote.tgz \
              "https://github.com/containers/podman/releases/download/$TAG/podman-remote-static-linux_amd64.tar.gz"
            tar -xzf remote.tgz
            BIN="$RUNNER_TEMP/podman-remote/bin/podman-remote-static-linux_amd64"
            "$BIN" --version
            echo "PODMAN_BIN=$BIN" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Record the real podman CLI against the mock socket
        run: |
          set -eu
          bash scripts/wire-contract/run.sh recording.jsonl "$PODMAN_BIN"
          V=$("$PODMAN_BIN" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "PODMAN_VERSION=$V" >> "$GITHUB_ENV"
          echo "tested podman $V"

      - name: Normalize the recording
        run: python3 scripts/wire-contract/normalize.py recording.jsonl "$PODMAN_VERSION" > normalized.json

      - name: Compare against the baseline (drift detection)
        if: (inputs.mode || 'check') == 'check'
        run: python3 scripts/wire-contract/compare.py scripts/wire-contract/baseline.json normalized.json

      - name: Prepare refreshed baseline
        if: (inputs.mode || 'check') == 'refresh'
        run: cp normalized.json baseline-refreshed.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wire-contract-${{ inputs.podman-version || 'latest' }}
          path: |
            recording.jsonl
            normalized.json
            baseline-refreshed.json
          if-no-files-found: ignore
