name: wire-contract

# Records what the REAL podman and docker CLIs send to a podm-shaped
# socket and diffs the request signatures against the checked-in baselines
# (scripts/wire-contract/baseline-<cli>.json), and diffs each CLI's
# subcommand tree (--help walk, commands-<cli>.json) so a NEW upstream
# command fails the job instead of sailing past the fixed recording
# battery. Upstream call-signature drift — the class that shipped as
# #49 (absolute-path -f), #52 (repeated t key) — fails the job with a
# per-command diff the day a new CLI behaves differently, instead of
# waiting for a user to hit it.
#
# Runs manually (dev/curiosity: pin any CLI version, or refresh the
# baselines after an intentional podm-side change) and monthly as a canary
# against the latest CLI releases.

on:
  workflow_dispatch:
    inputs:
      podman-version:
        description: 'podman client to test: "latest", "runner", or a x.y.z pin'
        default: 'latest'
      docker-version:
        description: 'docker client to test: "latest", "runner", or a x.y.z pin'
        default: 'latest'
      mode:
        description: 'check = diff vs baseline (fail on drift); refresh = upload new baselines to commit'
        type: choice
        options: [check, refresh]
        default: 'check'
  schedule:
    - cron: '0 6 1 * *' # monthly canary: 1st of the month, 06:00 UTC

concurrency:
  group: wire-contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cli: [podman, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Acquire the ${{ matrix.cli }} client under test
        run: |
          set -eu
          CLI="${{ matrix.cli }}"
          MODE="${{ (matrix.cli == 'podman' && inputs.podman-version) || (matrix.cli == 'docker' && inputs.docker-version) || 'latest' }}"
          if [ "$MODE" = "runner" ]; then
            # The runner's own client (the mock is the "server"; nothing
            # needs a container runtime).
            echo "CLI_BIN=$(command -v $CLI)" >> "$GITHUB_ENV"
          elif [ "$CLI" = podman ]; then
            # containers/podman GitHub releases ship a static remote-only
            # client per version.
            if [ "$MODE" = "latest" ]; then
              TAG=$(gh api repos/containers/podman/releases/latest --jq .tag_name)
            else
              TAG="v$MODE"
            fi
            mkdir -p "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
            curl -sSfL -o remote.tgz \
              "https://github.com/containers/podman/releases/download/$TAG/podman-remote-static-linux_amd64.tar.gz"
            tar -xzf remote.tgz
            BIN="$RUNNER_TEMP/cli/bin/podman-remote-static-linux_amd64"
            "$BIN" --version
            echo "CLI_BIN=$BIN" >> "$GITHUB_ENV"
          else
            # Docker ships static per-version client bundles.
            if [ "$MODE" = "latest" ]; then
              VERSION=$(curl -sSfL https://download.docker.com/linux/static/stable/x86_64/ \
                | grep -oE 'docker-[0-9]+\.[0-9]+\.[0-9]+\.tgz' | sort -uV | tail -1 \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            else
              VERSION="$MODE"
            fi
            mkdir -p "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
            curl -sSfL -o client.tgz \
              "https://download.docker.com/linux/static/stable/x86_64/docker-$VERSION.tgz"
            tar -xzf client.tgz
            BIN="$RUNNER_TEMP/cli/docker/docker"
            "$BIN" --version
            echo "CLI_BIN=$BIN" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Record the real ${{ matrix.cli }} CLI against the mock socket
        run: |
          set -eu
          bash scripts/wire-contract/run.sh recording.jsonl "${{ matrix.cli }}" "$CLI_BIN"
          V=$("$CLI_BIN" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "CLI_VERSION=$V" >> "$GITHUB_ENV"
          echo "tested ${{ matrix.cli }} $V"

      - name: Normalize the recording
        run: python3 scripts/wire-contract/normalize.py recording.jsonl "${{ matrix.cli }}" "$CLI_VERSION" > normalized.json

      - name: Extract the ${{ matrix.cli }} command tree
        run: |
          # Docker 29+ filters its help output by the CONNECTED daemon's API
          # version and Swarm state — against the runner's real daemon that
          # measures runner state, not the CLI. An unreachable endpoint
          # renders the full static command surface, so pin DOCKER_HOST to a
          # dead socket and isolate DOCKER_CONFIG (same isolation run.sh
          # uses) to make the tree daemon-independent.
          if [ "${{ matrix.cli }}" = docker ]; then
            export DOCKER_HOST="unix:///nonexistent-podm-wire-contract"
            export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
            mkdir -p "$DOCKER_CONFIG"
          fi
          python3 scripts/wire-contract/commands.py extract "${{ matrix.cli }}" "$CLI_BIN" > tree.json
          # Raw root help alongside the extracted tree: section headers vary
          # by binary flavor (static vs distro builds) and by version — this
          # is the ground truth to diff against when the tree looks wrong.
          "$CLI_BIN" --help > help-root.txt

      - name: Compare against the baseline (drift detection)
        if: (inputs.mode || 'check') == 'check'
        run: python3 scripts/wire-contract/compare.py "scripts/wire-contract/baseline-${{ matrix.cli }}.json" normalized.json

      - name: Compare the command tree (new-command detection)
        # !cancelled(): a request-signature drift must not mask command-surface
        # drift — both belong in one failure report. (A failed extraction
        # still stops this step, correctly: there is no tree to compare.)
        if: ${{ !cancelled() && (inputs.mode || 'check') == 'check' }}
        run: python3 scripts/wire-contract/commands.py compare "scripts/wire-contract/commands-${{ matrix.cli }}.json" tree.json

      - name: Prepare refreshed baseline
        if: (inputs.mode || 'check') == 'refresh'
        run: |
          cp normalized.json "baseline-refreshed-${{ matrix.cli }}.json"
          cp tree.json "commands-refreshed-${{ matrix.cli }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wire-contract-${{ matrix.cli }}
          path: |
            recording.jsonl
            normalized.json
            tree.json
            help-root.txt
            baseline-refreshed-${{ matrix.cli }}.json
            commands-refreshed-${{ matrix.cli }}.json
          if-no-files-found: ignore
