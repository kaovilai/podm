name: docs

# Keeps the published route-coverage documentation in lockstep with the code:
# builds podmd, runs `podmd --docgen` (the same RouteRegistry enumeration the
# route-conformance test enforces), splices the result into the README's
# route-coverage markers, commits the README if it changed, and deploys the
# generated site (index.html) to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "Sources/podmd/**"
      - "README.md"
  schedule:
    # Daily 04:23 UTC — off-peak, offset from the conformance run.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    name: regenerate route coverage + deploy pages
    runs-on: macos-26
    # deploy-pages requires the job to run in the github-pages environment —
    # the Pages deployment API rejects a deployment from a job without it
    # ("Missing environment").
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The README commit below needs history for pushing.
          fetch-depth: 0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build podmd
        run: swift build --product podmd

      - name: Generate route coverage
        run: .build/debug/podmd --docgen dist

      - name: Splice README section
        run: |
          python3 - << 'EOF'
          readme = open('README.md').read()
          section = open('dist/route-coverage.md').read()
          start = '<!-- podm:route-coverage:start -->'
          end = '<!-- podm:route-coverage:end -->'
          assert start in readme and end in readme, "README markers missing"
          i = readme.index(start) + len(start)
          j = readme.index(end)
          open('README.md', 'w').write(readme[:i] + '\n' + section + '\n' + readme[j:])
          print("README route-coverage section regenerated")
          EOF

      - name: Commit README if it changed
        run: |
          git config user.name "podm-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README unchanged — nothing to commit"
          else
            git add README.md
            git commit -m "docs(readme): regenerate route coverage [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
