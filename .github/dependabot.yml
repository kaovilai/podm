# Dependabot: all updates grouped — one PR per ecosystem, security included.
# No `applies-to` key: a group without it covers BOTH version updates and
# security updates (applies-to: security-updates would make the group
# security-ONLY and leave scheduled version updates one-PR-per-dependency
# again — Copilot review catch).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 20
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 20
    groups:
      # Everything in one Swift PR — the finer-grained apple-container /
      # apple-swift groups produced a PR per dependency (10 open at once),
      # which nobody reviewed separately anyway.
      swift-dependencies:
        patterns:
          - "*"
