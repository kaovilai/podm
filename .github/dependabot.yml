# Dependabot: all updates grouped — one PR per ecosystem, security included.
# Security updates join the same groups (applies-to: security-updates) so a
# advisory-driven bump arrives as one reviewable PR instead of ten.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 20
    groups:
      github-actions:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 20
    groups:
      # Everything in one Swift PR — the finer-grained apple-container /
      # apple-swift groups produced a PR per dependency (10 open at once),
      # which nobody reviewed separately anyway.
      swift-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
